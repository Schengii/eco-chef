<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <meta name="description" content="EcoChef - Dein intelligenter KI-Rezept-Zauberer. Koche kreativ und nachhaltig mit deinen Kühlschrankzutaten.">

        <!-- Content Security Policy (web + Cordova) -->
        <meta http-equiv="Content-Security-Policy"
              content="default-src 'self' data: blob:;
                       script-src 'self' 'unsafe-inline';
                       style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                       font-src 'self' https://fonts.gstatic.com data:;
                       img-src 'self' data: blob: https: content:;
                       connect-src 'self'
                           https://generativelanguage.googleapis.com
                           https://eco-chef-theta.vercel.app
                           https://world.openfoodfacts.org
                           https://kvdb.io
                           https://loremflickr.com
                           https://fonts.googleapis.com
                           https://fonts.gstatic.com;
                       media-src *;
                       worker-src 'self';">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="manifest" href="./manifest.json">
        <meta name="theme-color" content="#047857">
        <title>EcoChef - KI Rezept Zauberer</title>
        <style>
            * { margin: 0; padding: 0; }
            body { font-family: 'Outfit', system-ui, -apple-system, sans-serif; background-color: #96C7E8; overflow-x: hidden; }
        </style>
        <link rel="icon" href="favicon.ico">
    </head>
    <body>
        <eco-chef></eco-chef>

        <!-- cordova.js is injected by the native build; onerror suppresses the 404 in web/PWA -->
        <script src="cordova.js" onerror="void 0"></script>
        <script>
            // Register Service Worker only outside Cordova (file:// has no SW support)
            var isCordova = window.location.protocol === 'file:' ||
                            window.location.protocol === 'content:' ||
                            !!window.cordova;
            if (!isCordova && 'serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('./sw.js')
                        .then(function(reg) {
                            console.log('ServiceWorker registriert!', reg.scope);
                        })
                        .catch(function(err) {
                            console.log('ServiceWorker Fehler:', err);
                        });
                });
            }
        </script>
    </body>
</html>

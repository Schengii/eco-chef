name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json lacks cordova-plugin-network-information; switch back to `npm ci` after `npm install`
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci > npm.log 2>&1 || { echo "::error::$(grep -i 'npm error' npm.log | head -8 | tr '\n' ' ')"; exit 1; }
      - run: npm test
      - run: npm run build

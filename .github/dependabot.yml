version: 2
updates:
  # Minor-/Patch-Updates werden zu einem wöchentlichen PR gebündelt;
  # Major-Updates bleiben einzeln, damit sie bewusst geprüft werden.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # ts-jest only supports TypeScript <7 (peer dependency), so `npm ci` fails with ERESOLVE on 7.x
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
